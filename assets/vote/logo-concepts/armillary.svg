<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160" width="320" height="320" role="img"><title>Armillary logo concept</title><desc>Three tilted rings around a fixed center: spatial positioning.</desc><style>svg{--bg:#10151b;--fg:#f3f4f5;--ac:#e8944a}.bg{fill:#10151b}.ic{fill:none;stroke:#f3f4f5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;color:#f3f4f5}.a{stroke:#e8944a}.af{fill:#e8944a;stroke:none}.nf{fill:#f3f4f5;stroke:none}.hb{fill:#10151b;stroke:none}</style><rect class="bg" x="-20" y="-20" width="160" height="160"/><g id="mark" class="ic"><circle cx="60" cy="60" r="52" stroke-width="2.5"/><ellipse cx="60" cy="60" rx="50" ry="17" stroke-width="2"/><ellipse cx="60" cy="60" rx="50" ry="17" stroke-width="2" transform="rotate(60 60 60)"/><ellipse cx="60" cy="60" rx="50" ry="17" stroke-width="2" transform="rotate(-60 60 60)"/><circle class="af" cx="60" cy="60" r="6.5"/></g></svg>
