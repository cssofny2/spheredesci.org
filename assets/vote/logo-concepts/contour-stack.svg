<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160" width="320" height="320" role="img"><title>Contour Stack logo concept</title><desc>Thirteen stacked discs that add up to a sphere.</desc><style>svg{--bg:#f3f4f5;--fg:#10151b;--ac:#b8651f}.bg{fill:#f3f4f5}.ic{fill:none;stroke:#10151b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;color:#10151b}.a{stroke:#b8651f}.af{fill:#b8651f;stroke:none}.nf{fill:#10151b;stroke:none}.hb{fill:#f3f4f5;stroke:none}</style><rect class="bg" x="-20" y="-20" width="160" height="160"/><g id="mark" class="ic"><ellipse class="hb " cx="60" cy="14.4" rx="15.0" ry="3.3" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="22.0" rx="29.3" ry="6.5" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="29.6" rx="37.1" ry="8.2" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="37.2" rx="42.2" ry="9.3" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="44.8" rx="45.5" ry="10.0" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="52.4" rx="47.4" ry="10.4" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb a" cx="60" cy="60.0" rx="48.0" ry="10.6" stroke="var(--ac)" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="67.6" rx="47.4" ry="10.4" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="75.2" rx="45.5" ry="10.0" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="82.8" rx="42.2" ry="9.3" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="90.4" rx="37.1" ry="8.2" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="98.0" rx="29.3" ry="6.5" stroke="currentColor" stroke-width="2.4"/><ellipse class="hb " cx="60" cy="105.6" rx="15.0" ry="3.3" stroke="currentColor" stroke-width="2.4"/></g></svg>
