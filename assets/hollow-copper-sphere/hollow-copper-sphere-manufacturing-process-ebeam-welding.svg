<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Hollow copper sphere manufacturing process</title>
<desc id="d2">Eight-step process flow from certified copper stock through forming, machining, cleaning, vacuum electron-beam welding, annealing, finishing and inspection.</desc>
<rect width="960" height="420" fill="#0b1118"/>
<text x="40" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Baseline route: formed or machined halves, vacuum EB weld</text>
<text x="40" y="76" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Proposed sequence for review. Not yet confirmed with a fabricator.</text>
<rect x="40" y="110" width="205" height="118" rx="6" fill="#111a24" stroke="#26384a" stroke-width="1"/><text x="56" y="140" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 1</text><text x="56" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Certified stock</text><text x="56" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Lot-traced C10100 or</text><text x="56" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">99.999% Cu, with analysis</text><path d="M248 169.0 h14" stroke="#22d3ee" stroke-width="2"/><path d="M256 164.0 l6 5 l-6 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="265" y="110" width="205" height="118" rx="6" fill="#111a24" stroke="#26384a" stroke-width="1"/><text x="281" y="140" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 2</text><text x="281" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Form the halves</text><text x="281" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Machine from bar or form;</text><text x="281" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">spin for larger shells</text><path d="M473 169.0 h14" stroke="#22d3ee" stroke-width="2"/><path d="M481 164.0 l6 5 l-6 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="490" y="110" width="205" height="118" rx="6" fill="#111a24" stroke="#26384a" stroke-width="1"/><text x="506" y="140" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 3</text><text x="506" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Machine weld lips</text><text x="506" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Equator joint; wall map</text><text x="506" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">taken before joining</text><path d="M698 169.0 h14" stroke="#22d3ee" stroke-width="2"/><path d="M706 164.0 l6 5 l-6 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="715" y="110" width="205" height="118" rx="6" fill="#111a24" stroke="#26384a" stroke-width="1"/><text x="731" y="140" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 4</text><text x="731" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Clean and etch</text><text x="731" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Degrease, acid etch,</text><text x="731" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">DI rinse, dry</text><rect x="40" y="262" width="205" height="118" rx="6" fill="#111a24" stroke="#c86b3c" stroke-width="2"/><text x="56" y="292" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 5</text><text x="56" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Vacuum EB weld</text><text x="56" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Full-penetration seam;</text><text x="56" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">seals the cavity</text><path d="M248 321.0 h14" stroke="#22d3ee" stroke-width="2"/><path d="M256 316.0 l6 5 l-6 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="265" y="262" width="205" height="118" rx="6" fill="#111a24" stroke="#26384a" stroke-width="1"/><text x="281" y="292" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 6</text><text x="281" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Vacuum anneal</text><text x="281" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Stress relief; record</text><text x="281" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">time and temperature</text><path d="M473 321.0 h14" stroke="#22d3ee" stroke-width="2"/><path d="M481 316.0 l6 5 l-6 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="490" y="262" width="205" height="118" rx="6" fill="#111a24" stroke="#26384a" stroke-width="1"/><text x="506" y="292" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 7</text><text x="506" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Finish</text><text x="506" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Satin, low-gloss surface</text><text x="506" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">for vibrometer return</text><path d="M698 321.0 h14" stroke="#22d3ee" stroke-width="2"/><path d="M706 316.0 l6 5 l-6 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="715" y="262" width="205" height="118" rx="6" fill="#111a24" stroke="#26384a" stroke-width="1"/><text x="731" y="292" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e49b73">STEP 8</text><text x="731" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Inspect and document</text><text x="731" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Mass, dimensions, wall,</text><text x="731" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">weld, leak, mode survey</text><path d="M817.5 230 V245 H142.5 V258" fill="none" stroke="#22d3ee" stroke-width="2"/><path d="M137.5 252 l5 7 l5 -7" fill="none" stroke="#22d3ee" stroke-width="2"/></svg>