<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t1 d1">
<title id="t1">Hollow copper sphere cross-section, provisional baseline</title>
<desc id="d1">Cross-section of a sealed hollow copper sphere, 9.2 mm outer diameter with a 0.3 mm wall and an equatorial electron-beam weld seam, drawn to scale.</desc>
<rect width="960" height="540" fill="#0b1118"/>
<text x="40" y="52" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Provisional baseline: sealed thin-walled copper shell</text>
<text x="40" y="78" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Drawn to scale. Final geometry is set by finite-element modelling and measured mode shapes.</text>
<circle cx="270" cy="280" r="190" fill="#c86b3c"/><circle cx="270" cy="280" r="177.6086956521739" fill="#0b1118"/><circle cx="270" cy="280" r="190" fill="none" stroke="#e49b73" stroke-width="1.5"/><circle cx="270" cy="280" r="177.6086956521739" fill="none" stroke="#e49b73" stroke-width="1"/>
<line x1="80" y1="280" x2="460" y2="280" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="270" y="312" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">sealed, evacuated cavity</text>
<text x="270" y="334" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#94a3b8">&#216; 8.6 mm</text>
<line x1="80" y1="504" x2="460" y2="504" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="80" y1="497" x2="80" y2="511" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="460" y1="497" x2="460" y2="511" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="270" y="530" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#e2e8f0">&#216; 9.2 mm outer diameter</text>
<line x1="466" y1="280" x2="496" y2="256" stroke="#22d3ee" stroke-width="1.2"/>
<text x="502" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#22d3ee">EB weld seam</text>
<line x1="410.80229927328173" y1="161.8528426108763" x2="520" y2="110" stroke="#e49b73" stroke-width="1.2"/>
<text x="526" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#e49b73">0.3 mm wall (t/R &#8776; 0.065)</text>
<rect x="630" y="190" width="300" height="290" rx="6" fill="#111a24" stroke="#26384a"/>
<text x="650" y="222" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#e49b73">PROVISIONAL BASELINE</text>
<text x="650" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Material</text><text x="910" y="256" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#e2e8f0">C10100 or 99.999% Cu</text><line x1="650" y1="266" x2="910" y2="266" stroke="#26384a"/><text x="650" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Density</text><text x="910" y="290" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#e2e8f0">8.94 g/cm&#179;</text><line x1="650" y1="300" x2="910" y2="300" stroke="#26384a"/><text x="650" y="324" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Metal volume</text><text x="910" y="324" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#e2e8f0">0.075 cm&#179;</text><line x1="650" y1="334" x2="910" y2="334" stroke="#26384a"/><text x="650" y="358" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Mass</text><text x="910" y="358" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#e2e8f0">&#8776; 0.67 g</text><line x1="650" y1="368" x2="910" y2="368" stroke="#26384a"/><text x="650" y="392" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Cavity volume</text><text x="910" y="392" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#e2e8f0">0.33 cm&#179;</text><line x1="650" y1="402" x2="910" y2="402" stroke="#26384a"/><text x="650" y="426" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Breathing mode</text><text x="910" y="426" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#e2e8f0">&#8776; 229 kHz*</text><line x1="650" y1="436" x2="910" y2="436" stroke="#26384a"/><text x="650" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">* Thin-shell estimate, E = 130 GPa, &#957; = 0.34.</text></svg>